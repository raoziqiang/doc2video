# doc2video 默认配置(v0.2.1 方案;M0 Spike 结论将回填冻结值)
pipeline:
  version: "0.1.0"
  workspace: workspace

privacy:
  # 默认保守:云调用需显式 --privacy approved_cloud|unrestricted 并满足授权门禁
  default_mode: offline

llm:
  provider: ollama
  base_url: http://localhost:11434
  # M0 Spike 实测冻结(2026-08-27, docs/spikes/ollama_bench.json)
  model: qwen3-14b-agent:latest
  model_digest: 02dc9bf0f7800b68decf0deeca65137cc19df40229503452a531eea5c056dd82
  num_ctx: 8192                   # 每次 API 请求显式传入
  max_output_tokens: 2048
  temperature: 0.3
  think: false                    # 原生 /api/chat + think:false 实测无空 content
  structured_output: true         # format=json-schema 实测可用(2 场景 24.9s 冷启动)
  budget_reserve_ratio: 0.10      # 预算安全余量 10%
  app_concurrency: 1              # 应用侧保守 1;服务端并行实测有重叠,以 doctor 报告为准

tts:
  provider: edge-tts
  voice: zh-CN-XiaoxiaoNeural
  concurrency: 4

image:
  provider: fal
  # M0 Spike 冻结(2026-08-27, docs/spikes/fal_smoke.json + fal_contract_snapshot.json)
  endpoint: fal-ai/flux-2/klein/4b/base
  model_id: fal-ai/flux-2/klein/4b/base
  queue_url: https://queue.fal.run/fal-ai/flux-2/klein/4b/base
  concurrency: 3
  max_placeholder_ratio: 0.10
  max_consecutive_placeholder: 2

compose:
  fps: 25
  crf: 20
  profile: high
  level: "4.1"
  audio_khz: 48000
  audio_channels: 2
  audio_bitrate: "128k"
  lead_s: 0.5
  trail_s: 0.5
  fade_s: 0.3

subtitle:
  # M0 Spike 冻结(2026-08-27, docs/spikes/whisper_bench.json)
  aligner: "faster-whisper word_timestamps + 字符比例映射(确定性、零新依赖)"
  asr: "faster-whisper small @ cpu int8(中文 RTF 0.17x 实测;CUDA 12 运行库缺失,运行时自动降级)"
  max_line_chars: 18
  max_lines: 2
  min_display_s: 0.8
  font: Microsoft YaHei   # S2.5(L-04):字幕字体入配置并记录进 render_manifest

video:
  max_duration_s: 600
  chars_per_scene_min: 60
  chars_per_scene_max: 180
  chars_per_scene_plan: 500   # P2 章节场景数粗估:每 500 字 1 场景
  chars_per_second: 4.5
  max_scenes: 20

limits:
  max_input_mb: 200
  max_docx_uncompressed_mb: 512
  max_docx_entries: 2000
  max_pdf_pages: 500
  max_cloud_calls_per_job: 60
  max_cost_per_job: 5.0
  max_cost_per_day: 20.0

ops:
  # S3.4 运维配额:磁盘/工作区/缓存配额 + `doc2video cache gc`
  cache_max_gb: 2.0         # 共享缓存上限,超出按 LRU 淘汰(garbage_collect)
  cache_ttl_days: 14          # 缓存条目 TTL,超期即淘汰(无论体积)
  workspace_warn_gb: 20.0     # workspace 体积软配额:超限仅告警不阻断(先诊断再清)
  disk_free_min_gb: 1.0       # run 启动前磁盘剩余硬下限,不足直接拒绝(防写中磁盘满)

qc:
  # S2.1 QC 阈值矩阵:阈值全部参数化,发布语义由 publish 映射机器判定。
  duration_tolerance: 0.05      # 时长相对误差上限(对照 render_timeline.total_s)
  silence:
    noise_db: -50               # silencedetect 噪声门限
    detect_min_s: 2.0           # 最短检测段(ffmpeg d 参数)
    max_longest_s: 2.0          # 最长连续静音上限,超过 → fail
    max_ratio: 0.10             # 静音总占比上限,超过 → fail
  black:
    detect_min_s: 1.0
    pix_th: 0.10
    warn_s: 1.0                 # 最长黑帧 > warn_s → warn
    fail_s: 2.0                 # 最长黑帧 > fail_s → fail
  subtitle_coverage: 0.80       # 每场景字幕对旁白的原文覆盖率下限
  loudness:
    i_min: -19.0                # integrated LUFS 下限
    i_max: -13.0                # integrated LUFS 上限
    true_peak_max: -1.0         # true peak 上限(dBFS)
  max_uncovered_blocks: 0       # P2 coverage.uncovered 超过此数 → needs_review(证据覆盖不足不放行)
  publish:                      # status → 可否发布(晋升 final)的完整映射
    succeeded: true
    succeeded_with_warnings: true
    needs_review: false
    failed: false

parser:
  ocr_min_chars_per_page: 30   # 文本层低于此值 → 判定扫描页,走 OCR

retry:
  max_attempts_per_call: 3
  max_attempts_per_scene: 5
  backoff_base_s: 2
